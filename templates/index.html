<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONIET 30 años · Público en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --amarillo:#F5DE19;
    --verde:#8DC63F;
    --naranja:#DE5B2A;
    --celeste:#2FA9E0;
    --violeta:#7A2E8E;
    --magenta:#D93B96;
    --label-color:#7A2340; /* bordó/magenta apagado, derivado de la paleta */
    --rainbow: linear-gradient(90deg,
      var(--amarillo) 0%,
      var(--verde) 20%,
      var(--naranja) 40%,
      var(--celeste) 60%,
      var(--violeta) 80%,
      var(--magenta) 100%);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  .bg-video{
    position:fixed;
    top:50%;
    left:50%;
    width:100vh;
    height:100vw;
    object-fit:cover;
    transform:translate(-50%, -50%) rotate(270deg);
    filter:grayscale(85%) brightness(0.55) contrast(1.05);
    z-index:0;
  }

  .bg-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:1;
  }

  .frame-stripe{
    position:fixed;
    left:0;
    width:100%;
    height:1vh;
    background:var(--rainbow);
    background-size:200% 100%;
    animation:shift 12s linear infinite;
    z-index:5;
  }
  .frame-stripe.top{ top:0; }
  .frame-stripe.bottom{ bottom:0; }

  .screen{
    position:relative;
    z-index:2;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:3vh 4vw;
  }

  .logo{
    height:46vh;
    width:auto;
    max-width:90vw;
    object-fit:contain;
    margin-bottom:1.5vh;
    filter:drop-shadow(0 0.4vh 1.2vh rgba(0,0,0,0.6));
  }

  .label{
    font-size:3.6vh;
    font-weight:800;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--label-color);
    margin-bottom:1.5vh;
  }

  .counter-frame{
    position:relative;
    padding:1.4vh 3.5vw;
    border-radius:1.4vh;
  }

  .counter-frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:0.5vh;
    border-radius:1.4vh;
    background:var(--rainbow);
    background-size:200% 100%;
    animation:frameShift 12s linear infinite;
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }

  .counter{
    font-weight:900;
    font-size:18vh;
    line-height:1;
    letter-spacing:-0.02em;
    background:var(--rainbow);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shift 12s linear infinite;
    font-variant-numeric:tabular-nums;
  }

  @keyframes shift{
    0%{ background-position:0% 50%; }
    100%{ background-position:200% 50%; }
  }

  @keyframes frameShift{
    0%{ background-position:0% 50%; }
    100%{ background-position:200% 50%; }
  }

  .graph-toggle{
    position:fixed;
    top:2.2vh;
    right:2.2vw;
    z-index:10;
    display:inline-flex;
    align-items:center;
    gap:0.6vh;
    padding:1.1vh 2vw;
    border:none;
    border-radius:999px;
    font-family:inherit;
    font-weight:800;
    font-size:1.5vh;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#111;
    background:var(--rainbow);
    background-size:200% 100%;
    animation:shift 12s linear infinite;
    cursor:pointer;
    box-shadow:0 0.4vh 1.4vh rgba(0,0,0,0.5);
    transition:transform .2s ease;
  }
  .graph-toggle:hover{ transform:scale(1.05); }
  .graph-toggle:active{ transform:scale(0.97); }

  .graph-overlay{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
  }
  .graph-overlay.open{
    pointer-events:auto;
  }

  .graph-panel{
    position:fixed;
    top:0;
    right:0;
    height:100vh;
    width:min(34vw, 480px);
    overflow-y:auto;
    background:#121212;
    padding:3vh 2vw 2.5vh;
    box-shadow:-1vh 0 4vh rgba(0,0,0,0.6);
    transform:translateX(100%);
    opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
  }
  .graph-overlay.open .graph-panel{
    transform:translateX(0);
    opacity:1;
  }

  .graph-panel::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:0;
    width:0.5vh;
    background:var(--rainbow);
    background-size:200% 100%;
    animation:shift 12s linear infinite;
    pointer-events:none;
  }

  .graph-close{
    position:absolute;
    top:1.2vh;
    right:1.4vw;
    width:3.6vh;
    height:3.6vh;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    color:#fff;
    font-size:2vh;
    line-height:1;
    cursor:pointer;
  }
  .graph-close:hover{ background:rgba(255,255,255,0.22); }

  .graph-title{
    color:#fff;
    font-size:2.2vh;
    font-weight:800;
    letter-spacing:0.05em;
    text-transform:uppercase;
    margin-bottom:1.6vh;
    text-align:center;
  }

  .graph-kpis{
    display:flex;
    gap:1.2vw;
    justify-content:center;
    margin-bottom:2vh;
    flex-wrap:wrap;
  }
  .graph-kpi{
    color:#fff;
    background:rgba(255,255,255,0.06);
    border-radius:1vh;
    padding:0.8vh 1.6vw;
    text-align:center;
    font-size:1.3vh;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .graph-kpi b{
    display:block;
    font-size:2.4vh;
    font-variant-numeric:tabular-nums;
    font-weight:900;
  }

  .graph-canvas-wrap{
    position:relative;
    width:100%;
    height:40vh;
  }

  .graph-empty{
    color:rgba(255,255,255,0.6);
    text-align:center;
    font-size:1.6vh;
    padding:4vh 0;
  }
</style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="/img/video-fondo.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <div class="frame-stripe top"></div>
  <div class="frame-stripe bottom"></div>

  <button class="graph-toggle" id="graphToggle" type="button">Ver gráfico</button>

  <div class="graph-overlay" id="graphOverlay">
    <div class="graph-panel">
      <button class="graph-close" id="graphClose" type="button" aria-label="Cerrar">✕</button>
      <h2 class="graph-title">Entradas y salidas por tramo</h2>
      <div class="graph-kpis">
        <div class="graph-kpi">Entradas<b id="gk-ent">0</b></div>
        <div class="graph-kpi">Salidas<b id="gk-sal">0</b></div>
        <div class="graph-kpi">Neto<b id="gk-neto">0</b></div>
      </div>
      <div class="graph-canvas-wrap">
        <canvas id="graphCanvas"></canvas>
        <p class="graph-empty" id="graphEmpty">Esperando datos del registro…</p>
      </div>
    </div>
  </div>

  <main class="screen">
    <img class="logo" src="/static/img/logo-oniet30.png" alt="ONIET 30 años · Olimpiadas Nacionales">
    <h1 class="label">Espectadores</h1>
    <div class="counter-frame">
      <div class="counter" id="counter">0</div>
    </div>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // --- Lógica de Socket.IO: no modificar ---
    const socket = io();
    const counterEl = document.getElementById('counter');

    socket.on('count_update', (data) => {
      counterEl.textContent = data.count;
    });
    // --- fin lógica de Socket.IO ---
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    (function(){
      const toggleBtn = document.getElementById('graphToggle');
      const closeBtn = document.getElementById('graphClose');
      const overlay = document.getElementById('graphOverlay');
      const emptyMsg = document.getElementById('graphEmpty');
      const canvas = document.getElementById('graphCanvas');
      const kEnt = document.getElementById('gk-ent');
      const kSal = document.getElementById('gk-sal');
      const kNeto = document.getElementById('gk-neto');

      let estado = null;
      let chart = null;

      const hhmm = s => (s || '').slice(11, 16);

      function datosDeEstado(est){
        const labels = est.filas.map(f => `${hhmm(f.desde)}–${hhmm(f.hasta)}`);
        return {
          labels,
          entradas: est.filas.map(f => f.entradas),
          salidas: est.filas.map(f => f.salidas)
        };
      }

      function construirChart(){
        if (!estado || !estado.filas || !estado.filas.length) return;
        const { labels, entradas, salidas } = datosDeEstado(estado);
        emptyMsg.style.display = 'none';
        canvas.style.display = 'block';

        if (chart) {
          chart.data.labels = labels;
          chart.data.datasets[0].data = entradas;
          chart.data.datasets[1].data = salidas;
          chart.update();
          return;
        }

        chart = new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Entradas', data: entradas, backgroundColor: '#8DC63F', borderRadius: 4 },
              { label: 'Salidas', data: salidas, backgroundColor: '#DE5B2A', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 600, easing: 'easeOutQuart' },
            plugins: {
              legend: { labels: { color: '#fff', font: { weight: '600' } } }
            },
            scales: {
              x: { ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.08)' } },
              y: { beginAtZero: true, ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.08)' } }
            }
          }
        });
      }

      function actualizarKpis(){
        if (!estado) return;
        kEnt.textContent = estado.entradas;
        kSal.textContent = estado.salidas;
        kNeto.textContent = estado.neto;
      }

      function abrir(){
        overlay.classList.add('open');
        actualizarKpis();
        construirChart();
      }

      function cerrar(){
        overlay.classList.remove('open');
      }

      toggleBtn.addEventListener('click', abrir);
      closeBtn.addEventListener('click', cerrar);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrar(); });

      socket.on('registro_update', (data) => {
        estado = data;
        if (overlay.classList.contains('open')) {
          actualizarKpis();
          construirChart();
        }
      });
    })();
  </script>

</body>
</html>
